name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (${{ matrix.node-version }}, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
        shard: [1, 2, 3]

    env:
      # tests/global-setup.ts skips its own rebuild: the Build step below already produced dist/
      HEWTD_TEST_PREBUILT: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: matrix.shard == 1
        run: npm run lint

      # `npm run build` is `tsc`, the same project `npm run typecheck` checks, so a type error fails here
      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run --shard=${{ matrix.shard }}/3 ${{ matrix.node-version == '20.x' && '--coverage' || '' }}

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.node-version == '20.x'
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

  test-action:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build:all

      - name: Verify action dist
        run: |
          if [ ! -f dist/action/index.js ]; then
            echo "Action build failed - dist/action/index.js not found"
            exit 1
          fi
          echo "Action build successful"

      - name: Create test documentation
        run: |
          mkdir -p .documentation/security
          echo "---
          title: Test Document
          tier: guide
          domains: [security]
          status: active
          ---
          # Test Document
          This is a test." > .documentation/security/test-doc.md

      - name: Test action (init)
        uses: ./
        with:
          command: init
          docs-path: .documentation

      - name: Test action (maintain)
        uses: ./
        with:
          command: maintain
          mode: quick
          docs-path: .documentation
